<?xml version="1.0" encoding="UTF-8"?>
<!--
  Canary glyph sprite. Inlined once at the top of every dashboard page, then
  referenced with <use href="#g-verified"/> and so on. Every shape paints with
  currentColor, so the state colour comes from CSS.

  State glyphs, 16px grid. Round shapes mean no proven problem; angular
  shapes mean a problem.
    g-verified      Checked              filled circle
    g-resolved      Checked, gap filled  filled circle in a ring
    g-unresolvable  Can't be checked     dotted circle with a hatch
    g-unverified    Not checked          hollow circle
    g-disputed      Servers disagree     split diamond
    g-compromised   Data withheld        filled triangle

  Tone glyphs, 16px grid, for results that are not block states: payment
  outcomes and verify steps. None of them is a state symbol.
    g-tone-good     tick
    g-tone-bad      cross
    g-tone-neutral  dash

  UI icons, 20px grid, 1.5px stroke: copy, download, external, info, theme, menu,
  chevron.
-->
<svg xmlns="http://www.w3.org/2000/svg" class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <clipPath id="g-unresolvable-clip">
      <circle cx="8" cy="8" r="4"/>
    </clipPath>
  </defs>

  <symbol id="g-verified" viewBox="0 0 16 16">
    <circle cx="8" cy="8" r="6.5" fill="currentColor"/>
  </symbol>

  <symbol id="g-resolved" viewBox="0 0 16 16">
    <circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="8" cy="8" r="3.5" fill="currentColor"/>
  </symbol>

  <symbol id="g-unresolvable" viewBox="0 0 16 16">
    <circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="1.7 1.7"/>
    <g clip-path="url(#g-unresolvable-clip)" stroke="currentColor" stroke-width="1.25" fill="none">
      <path d="M0 11.75L11.75 0M0 16L16 0M4.25 16L16 4.25"/>
    </g>
  </symbol>

  <symbol id="g-unverified" viewBox="0 0 16 16">
    <circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/>
  </symbol>

  <symbol id="g-disputed" viewBox="0 0 16 16">
    <path d="M8 1.5L14.5 8L8 14.5L1.5 8Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M8 1.5L1.5 8L8 14.5Z" fill="currentColor"/>
  </symbol>

  <symbol id="g-compromised" viewBox="0 0 16 16">
    <path d="M8 1.75L14.75 14H1.25Z" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/>
  </symbol>

  <symbol id="g-tone-good" viewBox="0 0 16 16">
    <path d="M2.75 8.5L6.25 12L13.25 4.25" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="g-tone-bad" viewBox="0 0 16 16">
    <path d="M3.5 3.5L12.5 12.5M12.5 3.5L3.5 12.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <symbol id="g-tone-neutral" viewBox="0 0 16 16">
    <path d="M3 8H13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <symbol id="i-copy" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="7" y="7" width="9.5" height="9.5" rx="1.5"/>
    <path d="M13 7V4.75C13 4.06 12.44 3.5 11.75 3.5H4.75C4.06 3.5 3.5 4.06 3.5 4.75V11.75C3.5 12.44 4.06 13 4.75 13H7"/>
  </symbol>

  <symbol id="i-download" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 3.5V12.5"/>
    <path d="M6.25 8.75L10 12.5L13.75 8.75"/>
    <path d="M3.5 13.5V15.25C3.5 15.94 4.06 16.5 4.75 16.5H15.25C15.94 16.5 16.5 15.94 16.5 15.25V13.5"/>
  </symbol>

  <symbol id="i-external" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11.5 3.5H16.5V8.5"/>
    <path d="M16.5 3.5L9.5 10.5"/>
    <path d="M14.5 11.5V15.25C14.5 15.94 13.94 16.5 13.25 16.5H4.75C4.06 16.5 3.5 15.94 3.5 15.25V6.75C3.5 6.06 4.06 5.5 4.75 5.5H8.5"/>
  </symbol>

  <symbol id="i-info" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="10" r="6.75"/>
    <path d="M10 9.25V13.5"/>
    <circle cx="10" cy="6.6" r="0.95" fill="currentColor" stroke="none"/>
  </symbol>

  <symbol id="i-theme" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="10" r="6.75"/>
    <path d="M10 3.25A6.75 6.75 0 0 1 10 16.75Z" fill="currentColor" stroke="none"/>
  </symbol>

  <symbol id="i-chevron" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 5.5L12.5 10L8 14.5"/>
  </symbol>

  <symbol id="i-menu" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 6H16.5"/>
    <path d="M3.5 10H16.5"/>
    <path d="M3.5 14H16.5"/>
  </symbol>
</svg>
